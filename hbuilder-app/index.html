<!DOCTYPE html>
<html lang="zh-CN" style="background-color: #05020a;">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>AI 智能心灵伙伴</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=Plus+Jakarta+Sans:wght@300;400;550;700&display=swap" rel="stylesheet">

  <!-- ★ API 拦截器：必须在 React 之前加载 ★ -->
  <script src="js/api-interceptor.js"></script>

  <!-- React 样式 -->
  <link rel="stylesheet" crossorigin href="assets/index-B7oUdlhO.css">

  <style>
    body {
      margin: 0;
      background-color: #05020a;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .quote-font {
      font-family: 'Noto Serif SC', 'Georgia', serif;
    }

    /* ===== 启动画面 ===== */
    #splash-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(160deg, #05020a 0%, #0d0a1a 40%, #120822 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 99999; transition: opacity 0.6s ease-out;
      pointer-events: all;
    }
    #splash-screen.hidden { opacity: 0; pointer-events: none; }
    #splash-screen .icon {
      width: 80px; height: 80px; border-radius: 24px;
      background: linear-gradient(135deg, #f97316, #ec4899, #6366f1);
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; color: white; font-weight: bold; margin-bottom: 24px;
      animation: pulse-glow 2s ease-in-out infinite;
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(249,115,22,0.3), 0 0 40px rgba(236,72,153,0.2); }
      50% { box-shadow: 0 0 40px rgba(249,115,22,0.5), 0 0 80px rgba(236,72,153,0.4); }
    }
    #splash-screen .title { color: #fff; font-size: 20px; font-weight: 700; letter-spacing: 0.2em; }
    #splash-screen .subtitle { color: rgba(255,255,255,0.5); font-size: 12px; margin-top: 8px; letter-spacing: 0.1em; }
    #splash-screen .loader {
      margin-top: 32px; width: 40px; height: 40px;
      border: 2px solid rgba(255,255,255,0.15); border-top-color: rgba(249,115,22,0.8);
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-[#05020a] text-white min-h-screen">
  <!-- 启动画面 -->
  <div id="splash-screen">
    <div class="icon">心</div>
    <div class="title">AI 智能心灵伙伴</div>
    <div class="subtitle">温暖守护你的心灵港湾</div>
    <div class="loader"></div>
  </div>

  <!-- React 根节点 -->
  <div id="root" class="min-h-screen flex flex-col"></div>

  <!-- React 应用 -->
  <script type="module" crossorigin src="assets/index-BWNIMkIO.js"></script>

  <script>
    // 启动画面控制：React 渲染后自动隐藏
    (function() {
      var splash = document.getElementById('splash-screen');
      var root = document.getElementById('root');

      // 监听 React 渲染完成（root 节点有了内容）
      var observer = new MutationObserver(function(mutations) {
        for (var i = 0; i < mutations.length; i++) {
          var m = mutations[i];
          if (m.type === 'childList' && m.addedNodes.length > 0) {
            setTimeout(function() {
              splash.classList.add('hidden');
            }, 600);
            observer.disconnect();
            return;
          }
        }
      });
      observer.observe(root, { childList: true, subtree: true });

      // 超时兜底：8秒后无论如何隐藏启动画面
      setTimeout(function() {
        if (!splash.classList.contains('hidden')) {
          splash.classList.add('hidden');
        }
      }, 8000);
    })();
  </script>
</body>
</html>
